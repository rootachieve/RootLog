name: AI post-merge content sync

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ai-post-merge-main
  cancel-in-progress: false

jobs:
  sync:
    name: Generate metadata, graph, and next topics
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Generate metadata, summary, relations, and recommendations
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/ai-content.mjs sync

      - name: Verify generated content
        run: npm test && npm run build

      - name: Commit generated content
        id: commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- content/posts.json content/relations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts.json content/relations.json
          git commit -m "chore(ai): sync content for PR #${PR_NUMBER}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update next-topic issue
        if: ${{ steps.generate.outputs.issue_title != '' }}
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.generate.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.generate.outputs.issue_body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo
            const title = process.env.ISSUE_TITLE
            const body = process.env.ISSUE_BODY
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const previous = issues.find(issue => !issue.pull_request && issue.title === title)
            if (previous) {
              await github.rest.issues.update({ owner, repo, issue_number: previous.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, body })
            }

      - name: Redeploy Pages with generated content
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pages.yml',
              ref: context.payload.repository.default_branch,
            })
